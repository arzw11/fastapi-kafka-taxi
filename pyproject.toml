[project]
name = "fastapi-kafka-taxi"
version = "0.1.0"
description = ""
authors = [
    {name = "arzw",email = "dunkmemee@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lints = [
    "pre-commit (>=4.6.1,<5.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "flake8 (>=7.3.0,<8.0.0)"
]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "faker (>=40.36.0,<41.0.0)",
    "factory-boy (>=3.3.3,<4.0.0)"
]


[tool.isort]
multi_line_output = 3
include_trailing_comma = true
line_length = 120
lines_after_imports = 2
lines_between_sections = 1
lines_between_types = 0
force_alphabetical_sort_within_sections = true
ensure_newline_before_comments = true
combine_as_imports = true
combine_star = true
skip_gitignore = true
balanced_wrapping = true
force_grid_wrap = 2
src_paths = ["src"]
skip_glob = [
    ".git",
    ".idea",
    ".vscode",
    "venv",
    ".venv",
]
known_fastapi = ["fastapi"]
known_sqlalchemy = ["sqlalchemy"]
known_first_party = ["src"]
sections = [
    "FUTURE",
    "STDLIB",
    "FASTAPI",
    "SQLALCHEMY",
    "THIRDPARTY",
    "FIRSTPARTY",
    "LOCALFOLDER",
]
